services:
  - type: web
    name: midnight-cardworks
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: ""
      - key: SERVE_STATIC_ROOT
        value: apps/web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: midnight-cardworks-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: VITE_ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false

databases:
  - name: midnight-cardworks-db
    plan: free
