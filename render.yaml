services:
  - type: web
    name: midnight-cardworks
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run render:build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: ""
      - key: SERVE_STATIC_ROOT
        value: apps/web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: midnight-cardworks-db
          property: connectionString
      - key: APP_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER_URL
        sync: false
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: VITE_ADMIN_EMAILS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false
      - key: NEWSLETTER_COUPON_CODE
        sync: false
      - key: MARKETING_POSTAL_ADDRESS
        sync: false
      - key: VITE_PLAUSIBLE_DOMAIN
        sync: false
      - key: VITE_PLAUSIBLE_SRC
        value: https://plausible.io/js/script.js

databases:
  - name: midnight-cardworks-db
    plan: basic-256mb
